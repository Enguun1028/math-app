<!DOCTYPE html>
<html lang="mn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#0a0a0f">
    <title>Математикийн аялал — бүтэц</title>
    <style>
        :root {
            --bg: #0a0a0f;
            --surface: #12121a;
            --surface-2: #1a1a25;
            --line: rgba(255, 255, 255, 0.08);
            --text: rgba(255, 255, 255, 0.92);
            --muted: rgba(255, 255, 255, 0.55);
            --accent: #00e5e5;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: -apple-system, 'Segoe UI', system-ui, sans-serif;
            font-size: 15px;
            line-height: 1.45;
        }

        .app {
            max-width: 440px;
            margin: 0 auto;
            min-height: 100vh;
            padding: 0 16px calc(160px + env(safe-area-inset-bottom));
        }

        header {
            position: sticky;
            top: 0;
            z-index: 20;
            background: linear-gradient(var(--bg) 80%, transparent);
            padding: calc(16px + env(safe-area-inset-top)) 0 12px;
        }

        h1 {
            font-size: 22px;
            font-weight: 650;
            color: var(--accent);
        }

        .subtitle {
            color: var(--muted);
            font-size: 13px;
            margin-top: 2px;
        }

        .legend {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-top: 12px;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 5px;
            font-size: 12px;
            color: var(--muted);
            background: var(--surface);
            border: 1px solid var(--line);
            border-radius: 999px;
            padding: 3px 9px;
        }

        .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            flex: none;
        }

        .toolbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 10px;
            font-size: 12px;
            color: var(--muted);
        }

        .toggle {
            border: 1px solid var(--line);
            background: var(--surface);
            color: var(--text);
            border-radius: 999px;
            padding: 6px 12px;
            font: inherit;
            cursor: pointer;
        }

        .toggle.on {
            border-color: var(--accent);
            color: var(--accent);
        }

        .journey {
            position: relative;
            margin-top: 8px;
        }

        #edges {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
            overflow: visible;
        }

        .stage {
            position: relative;
            padding: 0 0 28px 40px;
        }

        /* Journey path down the left side */
        .stage::before {
            content: '';
            position: absolute;
            left: 13px;
            top: 28px;
            bottom: 0;
            width: 2px;
            background: var(--line);
        }

        .stage:last-child::before {
            display: none;
        }

        .stop {
            position: absolute;
            left: 0;
            top: 0;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            border: 2px solid var(--accent);
            color: var(--accent);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 13px;
            font-weight: 700;
            background: var(--bg);
        }

        .stage-title {
            font-size: 16px;
            font-weight: 650;
            padding-top: 3px;
        }

        .stage-why {
            font-size: 13px;
            color: var(--muted);
            margin: 2px 0 12px;
        }

        .topics {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            position: relative;
            z-index: 2;
        }

        .together {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            padding: 16px 6px 6px;
            border: 1px dashed rgba(255, 255, 255, 0.22);
            border-radius: 14px;
            position: relative;
            max-width: 100%;
        }

        .together::before {
            content: 'хамт';
            position: absolute;
            top: 1px;
            left: 10px;
            font-size: 10px;
            letter-spacing: 0.04em;
            color: var(--muted);
        }

        .topic {
            display: flex;
            align-items: center;
            gap: 7px;
            background: var(--surface);
            border: 1px solid var(--line);
            border-left: 3px solid var(--c);
            border-radius: 10px;
            padding: 8px 10px;
            font: inherit;
            font-size: 13.5px;
            color: var(--text);
            text-align: left;
            cursor: pointer;
            max-width: 100%;
            transition: opacity 0.2s, border-color 0.2s, background 0.2s;
        }

        .topic:active {
            transform: scale(0.97);
        }

        .journey.focus .topic {
            opacity: 0.25;
        }

        .journey.focus .topic.prereq,
        .journey.focus .topic.unlock,
        .journey.focus .topic.selected {
            opacity: 1;
        }

        .topic.selected {
            background: var(--surface-2);
            border-color: var(--c);
        }

        .topic.prereq::after,
        .topic.unlock::after {
            font-size: 11px;
            color: var(--muted);
            margin-left: 2px;
        }

        .topic.prereq::after {
            content: '↑ өмнө';
        }

        .topic.unlock::after {
            content: '↓ дараа';
        }

        /* Detail sheet */
        .sheet {
            position: fixed;
            left: 50%;
            bottom: 0;
            width: 100%;
            max-width: 440px;
            transform: translate(-50%, 100%);
            transition: transform 0.25s ease;
            background: var(--surface-2);
            border: 1px solid var(--line);
            border-bottom: none;
            border-radius: 18px 18px 0 0;
            padding: 16px 16px calc(20px + env(safe-area-inset-bottom));
            z-index: 30;
            max-height: 60vh;
            overflow-y: auto;
        }

        .sheet.open {
            transform: translate(-50%, 0);
        }

        .sheet-head {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 12px;
        }

        .sheet h2 {
            font-size: 18px;
            font-weight: 650;
        }

        .sheet .strand {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 12px;
            color: var(--muted);
            margin-top: 2px;
        }

        .close {
            border: none;
            background: var(--surface);
            color: var(--text);
            width: 32px;
            height: 32px;
            border-radius: 50%;
            font-size: 18px;
            cursor: pointer;
            flex: none;
        }

        .sheet p {
            margin-top: 10px;
            color: var(--text);
            font-size: 14px;
        }

        .sheet h3 {
            margin-top: 14px;
            font-size: 12px;
            font-weight: 600;
            color: var(--muted);
        }

        .sheet ul {
            list-style: none;
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-top: 6px;
        }

        .sheet li {
            font-size: 13px;
            background: var(--surface);
            border-left: 3px solid var(--c);
            border-radius: 8px;
            padding: 4px 8px;
        }

        .sheet .none {
            font-size: 13px;
            color: var(--muted);
            margin-top: 4px;
        }
    </style>
</head>
<body>
    <div class="app">
        <header>
            <h1>Математикийн аялал</h1>
            <div class="subtitle">Сэдэв бүр юун дээр тулгуурладаг, юуг хамт үзвэл зохистой вэ</div>
            <div class="legend" id="legend"></div>
            <div class="toolbar">
                <span>Сэдэв дээр дарж холбоог харна уу</span>
                <button class="toggle" id="allEdges">Бүх холбоо</button>
            </div>
        </header>

        <main class="journey" id="journey">
            <svg id="edges"></svg>
        </main>
    </div>

    <div class="sheet" id="sheet">
        <div class="sheet-head">
            <div>
                <h2 id="sheetTitle"></h2>
                <div class="strand" id="sheetStrand"></div>
            </div>
            <button class="close" id="sheetClose" aria-label="Хаах">×</button>
        </div>
        <p id="sheetText"></p>
        <div id="sheetTogether"></div>
        <h3>Өмнө нь мэдэх ёстой</h3>
        <div id="sheetPrereqs"></div>
        <h3>Үүний дараа нээгдэнэ</h3>
        <div id="sheetUnlocks"></div>
    </div>

    <script src="data.js"></script>
    <script>
        // Without data.js nothing can render - say so instead of showing a blank page
        if (typeof topics === 'undefined') {
            document.body.insertAdjacentHTML('beforeend',
                '<p style="position:fixed;inset:auto 16px 45% 16px;z-index:99;color:#ffb4a8;text-align:center;font:15px system-ui">' +
                'data.js файл олдсонгүй. index.html, structure.html, data.js гурвыг нэг хавтсанд хамт байршуулна уу.</p>');
            throw new Error('data.js not loaded');
        }
    </script>
    <script>

        const journey = document.getElementById('journey');
        const svg = document.getElementById('edges');
        const chips = {};
        let selected = null;
        let showAll = false;

        // Legend
        const legend = document.getElementById('legend');
        Object.values(strands).forEach(s => {
            const el = document.createElement('span');
            el.className = 'legend-item';
            el.innerHTML = `<span class="dot" style="background:${s.color}"></span>${s.name}`;
            legend.append(el);
        });

        function makeChip(id) {
            const t = topics[id];
            const chip = document.createElement('button');
            chip.className = 'topic';
            chip.style.setProperty('--c', strands[t.strand].color);
            chip.textContent = t.name;
            chip.addEventListener('click', () => select(selected === id ? null : id));
            chips[id] = chip;
            return chip;
        }

        stages.forEach((stage, i) => {
            const section = document.createElement('section');
            section.className = 'stage';
            section.innerHTML = `
                <div class="stop">${i + 1}</div>
                <div class="stage-title">${stage.title}</div>
                <div class="stage-why">${stage.why}</div>`;
            const row = document.createElement('div');
            row.className = 'topics';
            stage.items.forEach(item => {
                if (typeof item === 'string') {
                    row.append(makeChip(item));
                } else {
                    const group = document.createElement('div');
                    group.className = 'together';
                    item.ids.forEach(id => group.append(makeChip(id)));
                    row.append(group);
                }
            });
            section.append(row);
            journey.append(section);
        });

        // Curved line from the bottom of one chip to the top of another
        function edgePath(fromId, toId) {
            const base = journey.getBoundingClientRect();
            const a = chips[fromId].getBoundingClientRect();
            const b = chips[toId].getBoundingClientRect();
            const x1 = a.left + a.width / 2 - base.left;
            const y1 = a.bottom - base.top;
            const x2 = b.left + b.width / 2 - base.left;
            const y2 = b.top - base.top;
            const bend = Math.max(30, Math.abs(y2 - y1) * 0.5);
            return `M${x1},${y1} C${x1},${y1 + bend} ${x2},${y2 - bend} ${x2},${y2}`;
        }

        function drawEdges() {
            svg.innerHTML = '';
            const pairs = [];
            if (selected) {
                topics[selected].req.forEach(r => pairs.push([r, selected, 1]));
                unlocks[selected].forEach(u => pairs.push([selected, u, 1]));
            } else if (showAll) {
                Object.entries(topics).forEach(([id, t]) => t.req.forEach(r => pairs.push([r, id, 0.35])));
            }
            pairs.forEach(([from, to, opacity]) => {
                const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
                path.setAttribute('d', edgePath(from, to));
                path.setAttribute('fill', 'none');
                path.setAttribute('stroke', strands[topics[from].strand].color);
                path.setAttribute('stroke-width', opacity === 1 ? 2 : 1.2);
                path.setAttribute('stroke-opacity', opacity);
                svg.append(path);
            });
        }

        function listOf(ids) {
            if (!ids.length) return '<div class="none">—</div>';
            return '<ul>' + ids.map(id =>
                `<li style="--c:${strands[topics[id].strand].color}">${topics[id].name}</li>`
            ).join('') + '</ul>';
        }

        function select(id) {
            selected = id;
            Object.entries(chips).forEach(([cid, chip]) => {
                chip.classList.toggle('selected', cid === id);
                chip.classList.toggle('prereq', !!id && topics[id].req.includes(cid));
                chip.classList.toggle('unlock', !!id && unlocks[id].includes(cid));
            });
            journey.classList.toggle('focus', !!id);
            drawEdges();

            const sheet = document.getElementById('sheet');
            if (!id) {
                sheet.classList.remove('open');
                return;
            }
            const t = topics[id];
            const s = strands[t.strand];
            document.getElementById('sheetTitle').textContent = t.name;
            document.getElementById('sheetStrand').innerHTML = `<span class="dot" style="background:${s.color}"></span>${s.name}`;
            document.getElementById('sheetText').textContent = t.text;
            const group = partner[id];
            document.getElementById('sheetTogether').innerHTML = group
                ? `<h3>Хамт заах: ${group.ids.filter(x => x !== id).map(x => topics[x].name).join(', ')}</h3><p>${group.why}</p>`
                : '';
            document.getElementById('sheetPrereqs').innerHTML = listOf(t.req);
            document.getElementById('sheetUnlocks').innerHTML = listOf(unlocks[id]);
            sheet.classList.add('open');
        }

        document.getElementById('sheetClose').addEventListener('click', () => select(null));
        document.getElementById('allEdges').addEventListener('click', (e) => {
            showAll = !showAll;
            e.currentTarget.classList.toggle('on', showAll);
            drawEdges();
        });
        window.addEventListener('resize', drawEdges);
        document.fonts && document.fonts.ready.then(drawEdges);
        drawEdges();
    </script>
</body>
</html>
