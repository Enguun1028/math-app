<!doctype html>
<html lang="mn">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#05070d" />
    <title>матемап</title>
    <!-- Home-screen app: opens full screen with its own icon. -->
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <link rel="icon" type="image/svg+xml" href="logo.svg" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="матемап" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Loaded without blocking the first paint, so the loading screen shows at once even on a slow connection. -->
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" media="print" onload="this.media='all'" />
    <noscript><link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" /></noscript>
    <style>
      /* Loading screen: the матемап logo (owner, 2026-10-13). The lines grow out of the centre dot to the four ideas. */
      #splash { position: fixed; inset: 0; z-index: 100; display: grid; place-items: center; background: #05070d; transition: opacity 0.45s ease-out; }
      #splash.out { opacity: 0; pointer-events: none; }
      #splash .box { display: grid; justify-items: center; gap: 14px; padding: 0 24px; text-align: center; }
      #splash svg { width: 120px; height: 120px; margin-bottom: 8px; }
      #splash .ln { stroke-dasharray: 160; stroke-dashoffset: 160; animation: grow 0.55s 0.15s ease-out forwards; }
      #splash .dot { transform-box: fill-box; transform-origin: center; transform: scale(0); animation: pop 0.35s 0.55s cubic-bezier(0.3, 1.5, 0.6, 1) forwards; }
      #splash .name { font: 800 38px system-ui, -apple-system, 'Segoe UI', sans-serif; color: #ffffff; letter-spacing: -0.01em; }
      #splash .sub { font: 600 15px system-ui, sans-serif; color: #8d9abb; }
      #splash .tag { margin-top: 10px; padding-top: 14px; border-top: 1px solid #1f2a44; font: 700 15px system-ui, sans-serif; color: #e8eefc; }
      @keyframes grow { to { stroke-dashoffset: 0; } }
      @keyframes pop { to { transform: scale(1); } }
      @media (prefers-reduced-motion: reduce) { #splash .ln, #splash .dot { animation: none; stroke-dashoffset: 0; transform: none; } }
    </style>
  </head>
  <body>
    <!-- Static copy of the feedback form so Netlify Forms detects it at deploy time. -->
    <form name="feedback" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input name="bot-field" /><input name="entry" /><input name="kind" /><textarea name="message"></textarea>
    </form>
    <div id="splash" aria-hidden="true">
      <div class="box">
        <svg viewBox="0 0 512 512" aria-hidden="true">
          <rect width="512" height="512" rx="112" fill="#1b2539"/>
          <g stroke="#8fd3c2" stroke-width="18" stroke-linecap="round">
            <line class="ln" x1="256" y1="232" x2="138" y2="150"/><line class="ln" x1="256" y1="232" x2="378" y2="138"/>
            <line class="ln" x1="256" y1="232" x2="158" y2="378"/><line class="ln" x1="256" y1="232" x2="384" y2="362"/>
          </g>
          <g fill="#8fd3c2"><circle class="dot" cx="138" cy="150" r="30"/><circle class="dot" cx="378" cy="138" r="30"/><circle class="dot" cx="158" cy="378" r="30"/><circle class="dot" cx="384" cy="362" r="30"/></g>
          <circle cx="256" cy="232" r="40" fill="#fff"/>
        </svg>
        <div class="name">матемап</div>
        <div class="sub">Математикийн газрын зураг</div>
        <div class="tag">Хай. Ойлго. Өөрийн замаар сур.</div>
      </div>
    </div>
    <script>window.__splashAt = performance.now();</script>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
