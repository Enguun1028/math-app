  <!-- матемап logo (owner, 2026-10-13): one idea in the middle, linked to four others. -->
  <rect width="512" height="512" rx="112" fill="#1b2539"/>
  <g stroke="#8fd3c2" stroke-width="18" stroke-linecap="round">
    <line x1="256" y1="232" x2="138" y2="150"/>
    <line x1="256" y1="232" x2="378" y2="138"/>
    <line x1="256" y1="232" x2="158" y2="378"/>
    <line x1="256" y1="232" x2="384" y2="362"/>
